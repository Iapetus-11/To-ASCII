[tool.poetry]
name = "to-ascii"
version = "6.1.1"
description = "Convert videos, images, gifs, and even live video to ASCII art!"
authors = ["Milo Weinberg <iapetus011@gmail.com>"]
license = "MIT"
packages = [
    { include = "toascii" }
]
readme = "README.md"
repository = "https://github.com/Iapetus-11/To-ASCII"
keywords = ["ascii", "color", "colors", "ascii-art", "video", "image", "nim"]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
numpy = [
    { version = ">=2.2.6,<2.3", python = "3.10" },
    { version = ">=2.4.4,<2.5", python = "3.11" },
    { version = "^2.5.3", python = ">=3.12" },
]
opencv-python = "^4.14.0.94"
colorama = "^0.4.6"
nimporter = { version = "^1.1.0", optional = true }
setuptools = { version = "^84.0.0", optional = true }
pydantic = "^1.10.26"
click = "^8.5.0"

[tool.poetry.extras]
speedups = ["nimporter", "setuptools"]
cli = ["click"]

[tool.poetry.scripts]
toascii = "toascii.cli:toascii_command"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.14.11,<0.15"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
